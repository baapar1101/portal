  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    .product-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 30px;
    }
    .product-info {
      width: 50%;
    }
    .product-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .product-specs {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
    }
    .buy-link {
      background: #000000;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 20px;
      display: inline-block;
      margin-top: 10px;
    }
    .color-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .color-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    .color-table td:first-child {
      width: 30px;
    }
    .color-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid #ccc;
      display: inline-block;
    }
    @media (max-width: 600px) {
      .product-card {
        flex-direction: column;
      }
      .product-info, .color-table {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div id="products-container"></div>

<script>
const SHEET_URL = "https://sheets.googleapis.com/v4/spreadsheets/1mY1863LWKjc4BpqnsCa-5ifk1bo_48BsMVnAHDQs8Us/values/sheet4!A:N?key=AIzaSyBpmVvsxyi5FUHjBINu5GFkFZl2j-W4WD8";

fetch(SHEET_URL)
  .then(res => res.json())
  .then(data => {
    const rows = data.values;
    const headers = rows[0];
    const products = rows.slice(1);

    const grouped = {};

    for (let row of products) {
      const obj = {};
      headers.forEach((h, i) => obj[h] = row[i] || "");

      const key = obj["نام کالا لاتین"];
      if (!grouped[key]) {
        grouped[key] = {
          name: obj["نام محصول"] || obj["نام کالا لاتین"] || "بدون نام",
          storage: obj["Storage"],
          ram: obj["Ram"],
          link: obj["لینک محصول"],
          colors: []
        };
      }

      grouped[key].colors.push({
        hex: obj["color code"],
        price: obj["قیمت کالا"]
      });
    }

    const container = document.getElementById("products-container");

    Object.values(grouped).forEach(product => {
      const card = document.createElement("div");
      card.className = "product-card";

      const info = document.createElement("div");
      info.className = "product-info";
      info.innerHTML = `
        <div class="product-title">${product.name}</div>
        <div class="product-specs">حافظه: ${product.storage || "-"} | رم: ${product.ram || "-"}</div>
        ${product.link ? `<a class="buy-link" href="${product.link}" target="_blank">خرید محصول</a>` : ""}
      `;

      const table = document.createElement("table");
      table.className = "color-table";

      product.colors.forEach(c => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><span class="color-circle" style="background:${c.hex};"></span></td>
          <td>${c.price ? `${c.price} تومان` : "ناموجود"}</td>
        `;
        table.appendChild(row);
      });

      card.appendChild(info);
      card.appendChild(table);
      container.appendChild(card);
    });
  });
</script>

</body>
</html>
