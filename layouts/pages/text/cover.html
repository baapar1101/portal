<main class="page-container text-container text-cover-container">
	
	<div class="container">

			<div>

								</li>

									</ul>
								</if>
							</loop>
						</ul>
					</if>
				</div>
			</div>
		</div>
	</div>
</main>

<script>
const SHEET_ID = "14YFEkQrMHBFBkCM6lP88PzEzdE8E-r8vRFg2-ee4hGM";
const SHEET_NAME = "FATHER DAY";
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

let DATA = [];

const app = document.getElementById("app");
const search = document.getElementById("search");

fetch(URL)
  .then(r => r.text())
  .then(t => {
    const j = JSON.parse(t.substring(47).slice(0, -2));
    // حذف ردیف عنوان‌ها
    DATA = j.table.rows.map(r => r.c.map(c => c ? c.v : "")).slice(1);
	initFilters();   // ✅ این خط حیاتی است
    render();
  });

search.addEventListener("input", render);
const fCategory = document.getElementById("filter-category");
const fBrand    = document.getElementById("filter-brand");
const fPay      = document.getElementById("filter-pay");

function initFilters(){
  fillSelect(fCategory, 0); // دسته‌بندی
  fillSelect(fBrand, 1);    // برند
}

function fillSelect(select, index){
  select.querySelectorAll("option:not(:first-child)").forEach(o => o.remove());

  const values = [...new Set(DATA.map(r => r[index]).filter(Boolean))];
  values.forEach(v=>{
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
}


[fCategory, fBrand, fPay].forEach(el =>
  el.addEventListener("change", render)
);
function render(){
  const q = search.value.trim().toLowerCase();

  // فیلتر سرچ
const filtered = DATA.filter(r => {
  const matchSearch =
    (r[0] + r[1] + r[2]).toLowerCase().includes(q);

  const matchCategory =
    !fCategory.value || r[0] === fCategory.value;

  const matchBrand =
    !fBrand.value || r[1] === fBrand.value;

  const matchPay =
    !fPay.value || String(r[6]).includes(fPay.value);

  return matchSearch && matchCategory && matchBrand && matchPay;
});


  // گروه‌بندی بر اساس دسته‌بندی
  const groups = {};
  filtered.forEach(r => {
    const category = r[0] || "سایر";
    if(!groups[category]) groups[category] = [];
    groups[category].push(r);
  });

  // رندر نهایی
  app.innerHTML = Object.keys(groups).map(category => `
    <div class="section">
      <h2>${category}</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>تصویر</th>
              <th>برند</th>
              <th>مدل</th>
              <th>قیمت فروش (ریال)</th>
              <th>قیمت فروش ویژه </th>
              <th>تسویه</th>
            </tr>
          </thead>
          <tbody>
            ${groups[category].map(r => `
              <tr>
                <td>
                  <img src="/picture/${r[3]}.jpg"
                       style="width:60px;height:60px;object-fit:contain"
                       onerror="this.src='no-image.png'" loading="lazy" decoding="async">
                </td>
                <td>${r[1]}</td>
                <td>${r[2]}</td>
                <td class="price">${Number(r[4]).toLocaleString()}</td>
                <td class="price">${Number(r[5]).toLocaleString()}</td>
                <td>
  <div class="pay-tags">
    ${String(r[6]).split("،").map(t => {
      const v = t.trim();
      let cls = "";
      if(v.includes("نقد")) cls = "cash";
      else if(v.includes("اعتباری")) cls = "credit";
      else if(v.includes("چک")) cls = "check";
      return `<span class="pay-tag ${cls}">${v}</span>`;
    }).join("")}
  </div>
</td>

              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `).join("");
}
</script>
